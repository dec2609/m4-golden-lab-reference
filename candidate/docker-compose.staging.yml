services:
  order-app:
    image: ${ORDER_APP_IMAGE:?immutable approved reference required}
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: orders
      DB_USER: orders_app
      DB_PASSWORD: orders-app-dev
    ports:
      - "127.0.0.1:18081:8080"
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  order-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-dev
    mem_limit: 192m
    cpus: 0.5
    volumes:
      - order-db-data:/var/lib/postgresql/data
      - ./ma-nguon/database/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./ma-nguon/database/002-runtime-role.sql:/docker-entrypoint-initdb.d/002-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  order-db-data:
