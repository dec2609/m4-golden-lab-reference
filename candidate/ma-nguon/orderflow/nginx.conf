worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker embedded DNS; re-resolve when the backend container gets a new IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream order_api {
        zone order_api 64k;
        server order-app:8080 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        # Keep API errors out of the SPA fallback.
        location = /api { return 404; }
        location ^~ /api/ {
            proxy_pass http://order_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_intercept_errors off;
            # A failed write must never be replayed to another upstream.
            proxy_next_upstream off;
        }
        location /assets/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
